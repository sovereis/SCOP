name: SCOP tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2
      - name: Run complete suite
        run: python -m pytest -q
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts --prefix tests/ui
          tests/ui/node_modules/.bin/playwright install --with-deps chromium
      - name: Run Workspace and landing browser tests
        run: node --test tests/ui/*.test.cjs
